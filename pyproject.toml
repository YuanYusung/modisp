[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "modisp"
version = "0.4.0"
description = "Multimodal Rayleigh and Love dispersion with CPU FP64 and optional CUDA FP64/FP32"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=1.24"]
authors = [{name = "Yuan Yusong"}]

[project.optional-dependencies]
cuda12 = ["modisp-cuda12==0.4.0; platform_system=='Linux' and platform_machine=='x86_64'"]
test = ["pytest>=7", "scipy>=1.10", "disba==0.7.0"]
docs = ["sphinx>=7", "myst-parser>=2"]

[project.scripts]
modisp = "modisp.cli:main"

[tool.scikit-build]
cmake.version = ">=3.22"
wheel.packages = ["python/modisp"]
sdist.exclude = [".venv*/**", ".bench/**", "build*/**", "dist/**", "research/**", "cuda-plugin/**", "wheelhouse/**", "release/**", "source-*.tgz", "**/__pycache__/**", "**/.numba-cache/**", "**/.pytest_cache/**", "**/._*", "**/.DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
